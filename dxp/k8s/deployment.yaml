apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.name }}
  labels:
    app: ${{ values.name }}
    dxp.io/managed: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${{ values.name }}
  template:
    metadata:
      labels:
        app: ${{ values.name }}
        backstage.io/kubernetes-id: ${{ values.name }}
    spec:
      nodeSelector:
        role: workload
      tolerations:
      - key: role
        operator: Equal
        value: workload
        effect: NoSchedule
      containers:
      - name: ${{ values.name }}
        image: harbor.dxp/dxp/${{ values.name }}:latest
        imagePullPolicy: Always
        envFrom:
        - secretRef:
            name: PLACEHOLDER_DB_SECRET
            optional: true
        env:
        - name: ALLOWED_ORIGINS
          value: ""
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ values.name }}
spec:
  selector:
    app: ${{ values.name }}
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ values.name }}
  labels:
    app: ${{ values.name }}
    dxp.io/managed: "true"
spec:
  ingressClassName: nginx
  # S91 -- tls: sans secretName ajoute (chantier retrait HTTP). Necessaire
  # pour que ssl-redirect=true (ConfigMap controleur ingress-nginx)
  # produise un effet reel : la fonction certificate_configured_for_current_request()
  # d'ingress-nginx (lua_ingress.lua) exige un cert explicitement enregistre
  # pour CE host precis avant d'autoriser la redirection HTTP->HTTPS -- le
  # default-ssl-certificate seul (dxp-platform-tls) ne suffit pas, meme s'il
  # sert bien de fallback pour le handshake TLS lui-meme. Verifie en
  # conditions reelles (S91, cristal-backend). Pas de secretName : continue
  # a utiliser le certificat par defaut du controleur, ce bloc sert
  # uniquement a enregistrer le host aupres du mecanisme de redirection.
  tls:
  - hosts:
    - ${{ values.name }}.68.221.5.247.nip.io
  rules:
  - host: ${{ values.name }}.68.221.5.247.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ${{ values.name }}
            port:
              number: 80
